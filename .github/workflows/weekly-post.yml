name: Weekly Telegram post

on:
  schedule:
    - cron: "30 14 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-test and send one config
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: 2cbd1ab46bd942809c89592830a94719
          WORKER_URL: https://config-boost-test.configboost.workers.dev
        run: python scripts/weekly_post.py
