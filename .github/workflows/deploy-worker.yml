name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to deploy without WORKER_SECRET
        env:
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_SECRET}" ]; then
            echo "::error::Repo secret WORKER_SECRET is not registered. Register it in Settings > Secrets and variables > Actions before deploying; otherwise the /test endpoint would be deployed without authentication."
            exit 1
          fi

      - name: Deploy TCP tester to Cloudflare Workers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          meta = {
              "main_module": "tcp-test.js",
              "compatibility_date": "2024-11-01",
              "secrets": [
                  {"name": "WORKER_SECRET", "type": "secret_text", "data": os.environ["WORKER_SECRET"]}
              ],
          }
          with open("/tmp/metadata.json", "w", encoding="utf-8") as fh:
              json.dump(meta, fh)
          PY
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/config-boost-test"             -H "Authorization: Bearer ${CF_TOKEN}"             -F 'metadata=@/tmp/metadata.json;type=application/json'             -F 'tcp-test.js=@worker/tcp-test.js;type=application/javascript+module' > /tmp/deploy.json
          python3 -c "import json,sys; d=json.load(open('/tmp/deploy.json')); sys.exit(0 if d.get('success') else 1)"

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            sleep 6
            out=$(curl -sS https://config-boost-test.configboost.workers.dev/health || true)
            echo "attempt $i: $out"
            echo "$out" | grep -q '"ok":true' && exit 0
          done
          exit 1
