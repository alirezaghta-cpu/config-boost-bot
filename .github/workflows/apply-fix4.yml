name: Apply fix4 (admin test/send cards show URI)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch and compile check
        run: |
          python scripts/apply_fix4.py
          python -m py_compile bot/handlers.py bot/locales/fa.py
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers.py
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "fix: include config URI in admin test/send cards so admin can copy & test"
          git push
