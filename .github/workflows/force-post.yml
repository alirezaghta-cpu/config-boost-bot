name: Force post (channel + group)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: force-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check all scripts
        run: python -m py_compile scripts/force_post.py scripts/weekly_post.py scripts/refresh_sources.py
      - name: Retest freshest configs and post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: 2cbd1ab46bd942809c89592830a94719
          WORKER_URL: https://config-boost-test.configboost.workers.dev
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: python scripts/force_post.py
